<ion-card>

  <ion-card-header>
    <span> <b>{{ produto?.nome}}</b> </span>
  </ion-card-header>

  <ion-card-content>
    <p> estoque:  {{ produto?.estoque}}
      <span *ngIf="(produto?.estoque ?? 99) <= 3">Esgotando..</span>
    </p>
    <ion-button (click)="aoClicar()">Ver detalhes</ion-button>
  </ion-card-content>

</ion-card>
